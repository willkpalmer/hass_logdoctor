scan_now:
  name: Scan now
  description: >-
    Immediately scan the Home Assistant log for anomalies, outside of the
    daily schedule. Only reports findings - never changes any configuration.

clear_history:
  name: Clear history
  description: >-
    Forget which anomalies have already been reported. The next scan will
    treat everything it finds as new.

send_weekly_digest:
  name: Send weekly digest
  description: >-
    Send the weekly digest (the last seven days) now, as a notification and
    to the daily summary's notify service if one is set.

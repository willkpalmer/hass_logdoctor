# Runs the tests (tests/) on every push and pull request: against the latest
# Home Assistant release (what's in use) and the oldest one still checked.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: latest Home Assistant
            python: "3.14"
            homeassistant: homeassistant
          - name: Home Assistant 2026.2
            python: "3.13"
            homeassistant: homeassistant==2026.2.3
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install "${{ matrix.homeassistant }}" "openai>=1.0" pytest pytest-asyncio
      - name: Test
        run: pytest -q
